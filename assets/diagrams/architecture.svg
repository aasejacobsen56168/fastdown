<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="440" viewBox="0 0 1140 440" role="img" aria-label="Fastdown 解析链路">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c7790b"/>
    </marker>
    <marker id="arw-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff5a36"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="1139" height="439" rx="18" fill="#fcfaf5" stroke="#eee5d4"/>

  <text x="34" y="46" font-family="'Avenir Next', Avenir, 'PingFang SC', sans-serif" font-size="19" font-weight="700" fill="#151711">Fastdown 解析链路</text>
  <text x="34" y="67" font-family="'Avenir Next', Avenir, 'PingFang SC', sans-serif" font-size="12" fill="#74796e">一次解析：从公开分享链接到无水印直链的完整路径</text>
  <text x="1106" y="46" text-anchor="end" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#ff5a36">fastdown.pro</text>

  <!-- stage cards -->
  <g font-family="'Avenir Next', Avenir, 'PingFang SC', sans-serif">
    <!-- 1 -->
    <rect x="30" y="104" width="196" height="150" rx="14" fill="#fffaf0" stroke="#e8ddc9"/>
    <circle cx="54" cy="130" r="11" fill="#ff5a36"/>
    <text x="54" y="134.5" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">1</text>
    <text x="74" y="135" font-size="14.5" font-weight="700" fill="#151711">公开分享链接</text>
    <line x1="48" y1="152" x2="208" y2="152" stroke="#efe4d0"/>
    <text x="48" y="176" font-size="11.5" fill="#4c5348">TikTok / 抖音 / TK</text>
    <text x="48" y="197" font-size="11.5" fill="#4c5348">小红书 / YouTube</text>
    <text x="48" y="218" font-size="11.5" fill="#4c5348">IG Reels / FB / X</text>

    <!-- 2 -->
    <rect x="250" y="104" width="196" height="150" rx="14" fill="#fffaf0" stroke="#e8ddc9"/>
    <circle cx="274" cy="130" r="11" fill="#ff5a36"/>
    <text x="274" y="134.5" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">2</text>
    <text x="294" y="135" font-size="14.5" font-weight="700" fill="#151711">统一入口</text>
    <line x1="268" y1="152" x2="428" y2="152" stroke="#efe4d0"/>
    <text x="268" y="176" font-size="11.5" fill="#4c5348">Web 网页版 / H5</text>
    <text x="268" y="197" font-size="11.5" fill="#4c5348">CLI + MCP 本地</text>
    <text x="268" y="218" font-size="11.5" fill="#4c5348">REST API 服务端</text>

    <!-- 3 -->
    <rect x="470" y="104" width="196" height="150" rx="14" fill="#fffaf0" stroke="#e8ddc9"/>
    <circle cx="494" cy="130" r="11" fill="#5b4bdb"/>
    <text x="494" y="134.5" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">3</text>
    <text x="514" y="135" font-size="14.5" font-weight="700" fill="#151711">鉴权 + 配额</text>
    <line x1="488" y1="152" x2="648" y2="152" stroke="#efe4d0"/>
    <text x="488" y="176" font-size="11.5" fill="#4c5348">Google / 邮箱验证码</text>
    <text x="488" y="197" font-size="11.5" fill="#4c5348">fd_live_ API Key</text>
    <text x="488" y="218" font-size="11.5" fill="#4c5348">成功才扣一次配额</text>

    <!-- 4 -->
    <rect x="690" y="104" width="196" height="150" rx="14" fill="#fffaf0" stroke="#e8ddc9"/>
    <circle cx="714" cy="130" r="11" fill="#5b4bdb"/>
    <text x="714" y="134.5" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">4</text>
    <text x="734" y="135" font-size="14.5" font-weight="700" fill="#151711">解析与选流</text>
    <line x1="708" y1="152" x2="868" y2="152" stroke="#efe4d0"/>
    <text x="708" y="176" font-size="11.5" fill="#4c5348">平台识别 · 拉取上游</text>
    <text x="708" y="197" font-size="11.5" fill="#4c5348">优选无水印 / 原画</text>
    <text x="708" y="218" font-size="11.5" fill="#4c5348">按 media_type 选轨</text>

    <!-- 5 -->
    <rect x="910" y="104" width="196" height="150" rx="14" fill="#fffaf0" stroke="#e8ddc9"/>
    <circle cx="934" cy="130" r="11" fill="#ff5a36"/>
    <text x="934" y="134.5" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">5</text>
    <text x="954" y="135" font-size="14.5" font-weight="700" fill="#151711">直链 + 元数据</text>
    <line x1="928" y1="152" x2="1088" y2="152" stroke="#efe4d0"/>
    <text x="928" y="176" font-size="11.5" fill="#4c5348">media[].url 直链</text>
    <text x="928" y="197" font-size="11.5" fill="#4c5348">title / author / cover</text>
    <text x="928" y="218" font-size="11.5" fill="#4c5348">quota 余量一并回传</text>
  </g>

  <!-- arrows -->
  <g stroke="#c7790b" stroke-width="1.7" fill="none">
    <line x1="228" y1="179" x2="244" y2="179" marker-end="url(#arw)"/>
    <line x1="448" y1="179" x2="464" y2="179" marker-end="url(#arw)"/>
    <line x1="668" y1="179" x2="684" y2="179" marker-end="url(#arw)"/>
    <line x1="888" y1="179" x2="904" y2="179" marker-end="url(#arw)"/>
  </g>

  <!-- connector to client band -->
  <path d="M1008,254 L1008,288" stroke="#ff5a36" stroke-width="1.7" stroke-dasharray="5 4" fill="none" marker-end="url(#arw-coral)"/>

  <!-- client band -->
  <rect x="30" y="292" width="1076" height="112" rx="16" fill="#fff4ee" stroke="#ffd3c2"/>
  <text x="56" y="326" font-family="'Avenir Next', Avenir, 'PingFang SC', sans-serif" font-size="14.5" font-weight="700" fill="#151711">客户端直连 CDN 下载</text>
  <text x="56" y="349" font-family="'Avenir Next', Avenir, 'PingFang SC', sans-serif" font-size="11.5" fill="#4c5348">服务端只回直链与元数据，不代理、不落盘源文件；Web 点一下、CLI 存本地、API 自己取。</text>
  <text x="56" y="371" font-family="'Avenir Next', Avenir, 'PingFang SC', sans-serif" font-size="11.5" fill="#74796e">直链由源站签发，有效期与平台策略相关；需要长期留存请及时转存。</text>

  <g font-family="'Avenir Next', Avenir, 'PingFang SC', sans-serif" font-size="10.5" font-weight="700">
    <rect x="744" y="310" width="112" height="26" rx="13" fill="#ffffff" stroke="#ffd3c2"/>
    <text x="800" y="327" text-anchor="middle" fill="#b53b2a">只处理公开链接</text>
    <rect x="866" y="310" width="112" height="26" rx="13" fill="#ffffff" stroke="#ffd3c2"/>
    <text x="922" y="327" text-anchor="middle" fill="#b53b2a">失败不计配额</text>
    <rect x="988" y="310" width="98" height="26" rx="13" fill="#ffffff" stroke="#ffd3c2"/>
    <text x="1037" y="327" text-anchor="middle" fill="#b53b2a">不留存内容</text>
  </g>
</svg>
